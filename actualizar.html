<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizar Centro Quant</title><style>body{font-family:system-ui;background:#07111f;color:white;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px}.box{max-width:520px;text-align:center;padding:28px;border:1px solid #285275;border-radius:20px;background:#0e2035}button{font-size:18px;font-weight:800;padding:14px 22px;border:0;border-radius:12px;background:#59c3ff;color:#06101c}#status{margin:18px 0;color:#b9d7ec}</style></head><body><div class="box"><h1>Actualizar Centro Quant</h1><p id="status">Pulsa el botón para borrar la versión v4 guardada en el teléfono.</p><button id="go">Eliminar v4 y abrir v6.1</button></div><script>document.getElementById('go').onclick=async()=>{const s=document.getElementById('status');s.textContent='Eliminando caché anterior…';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}s.textContent='Listo. Abriendo v6.1…';setTimeout(()=>location.replace('./?v=61&actualizado='+Date.now()),600);}catch(e){s.textContent='No se pudo limpiar automáticamente. Borra la app de inicio y vuelve a agregarla desde Safari.';}}</script></body></html>
